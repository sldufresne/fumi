<style>
  :root { --paper: #F6F6F8; --surface: #FFFFFF; --ink: #18191D; --ink2: #5B5D66; --accent: #4A50C9; }

    :root { --paper: #17181B; --surface: #222327; --ink: #ECECEF; --ink2: #A3A5AE; --accent: #9DA3F7; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header svg { width: 40px; height: 40px; border-radius: 9px; flex: none; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0; }
  .lead { color: var(--ink2); margin: 0 0 24px; }
  a.card { display: block; background: var(--surface); border-radius: 14px; padding: 16px 18px; margin: 10px 0; color: var(--accent); font-weight: 600; text-decoration: none; }
</style>
</head>

<main>

    <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#1C1D2E"/><rect x="17" y="15" width="66" height="70" rx="18" fill="#ECECEF"/><circle cx="33" cy="31" r="5.9" fill="#585FD8"/></svg>
